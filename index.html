<title>ReWild — the field list for your yard</title>
<meta name="description" content="Native plants matched to your location and light, cash rebates for replacing lawn, and a wildlife log that proves it worked. Keep your yard as a field list.">
<meta name="theme-color" content="#F2C300">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── The Field List: a waterproof notebook, not stationery ── */
  --stock:#E7EBE3;        /* waterproof grid stock — cool, never cream */
  --sheet:#F7F8F5;        /* the whiter page you write on */
  --shade:#DDE3D8;        /* shaded region on the blank */
  --graphite:#1F2420;     /* pencil ink */
  --graphite-2:#4A544C;   /* secondary pencil, AA on stock */
  --rule:#B9C4B4;         /* printed grid rule */
  --rule-firm:#7E8F73;    /* heavier rule */
  --hivis:#F2C300;        /* high-visibility cover — logged, active, tallied */
  --hivis-deep:#C79E00;   /* hi-vis pressed */
  --survey:#E2571E;       /* surveyor flagging — fills and large figures */
  --survey-ink:#B03B0F;   /* the same flag, darkened for small text (AA on both grounds) */
  --stamp:#5B3A8C;        /* locality stamp ink */
  --survey-deep:#C44A14;  /* surveyor flag, pressed */
  --stamp-wash:rgba(255,255,255,0.42); /* the paper showing through a rubber stamp */
  --field:'Archivo',system-ui,sans-serif;
  --code:'Azeret Mono',ui-monospace,monospace;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --grid:22px;            /* the notebook's ruling pitch */
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  background:var(--stock);
  /* the printed grid — the signature of the whole world */
  background-image:
    linear-gradient(var(--rule) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:var(--grid) var(--grid);
  color:var(--graphite);font-family:var(--field);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:clip;
}
::selection{background:var(--hivis);color:var(--graphite)}
:focus-visible{outline:2.5px solid var(--stamp);outline-offset:2px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mono{font-family:var(--code);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
::-webkit-scrollbar{width:13px;height:13px}
::-webkit-scrollbar-track{background:var(--stock)}
::-webkit-scrollbar-thumb{background:var(--rule-firm);border:3px solid var(--stock)}
::-webkit-scrollbar-thumb:hover{background:var(--graphite-2)}

.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(0.9rem,3vw,1.6rem)}

/* ── LOCALITY BLOCK: the one control that propagates ── */
.locality{background:var(--hivis);border-bottom:3px solid var(--graphite)}
.loc-in{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:0.75rem 0}
.brand{display:flex;align-items:baseline;gap:0.5rem;font-weight:800;font-size:1.02rem;letter-spacing:-0.02em}
.brand span{font-family:var(--code);font-size:0.72rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;opacity:0.75}
.loc-stamp{
  margin-left:auto;display:flex;align-items:center;gap:0.5rem;
  font-family:var(--code);font-size:0.72rem;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;
  color:var(--stamp);border:2.5px solid var(--stamp);padding:0.3rem 0.62rem;
  background:var(--stamp-wash);transform:rotate(-1.2deg);
}
.loc-stamp button{color:inherit;font:inherit;text-decoration:underline;text-underline-offset:2px}
@media (max-width:640px){.loc-stamp{margin-left:0;width:100%;justify-content:center}}

/* ── TALLY BAND: running totals, the first thing on the page ── */
.tallies{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--graphite);background:var(--sheet)}
.tally{padding:0.85rem 0.9rem;border-right:1px solid var(--rule)}
.tally:last-child{border-right:0}
.tally b{display:block;font-family:var(--code);font-weight:700;font-size:clamp(1.35rem,3.4vw,2rem);line-height:1;letter-spacing:-0.03em}
.tally small{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--graphite-2);margin-top:0.34rem}
.tally.lit b{color:var(--survey)}
@media (max-width:720px){.tallies{grid-template-columns:1fr 1fr}.tally:nth-child(-n+2){border-bottom:1px solid var(--rule)}.tally:nth-child(2n){border-right:0}}

/* ── INDEX TABS ── */
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding-top:0.6rem;border-bottom:2px solid var(--graphite)}
.tab{
  font-family:var(--code);font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  padding:0.5rem 0.85rem;background:var(--shade);border:2px solid var(--graphite);border-bottom:0;
  white-space:nowrap;flex:none;position:relative;top:2px;
  transition:background-color 140ms var(--ease),transform 110ms var(--ease);
}
.tab:active{transform:scale(0.97)}
.tab[aria-current="page"]{background:var(--sheet);padding-bottom:0.66rem}
@media (hover:hover) and (pointer:fine){.tab:hover{background:var(--sheet)}}

/* ── THE SHEET ── */
main{background:var(--sheet);border-left:2px solid var(--graphite);border-right:2px solid var(--graphite);border-bottom:2px solid var(--graphite);min-height:60vh}
.pad{padding:clamp(1rem,3vw,1.7rem)}
h1{font-size:clamp(1.4rem,3.6vw,2.1rem);font-weight:800;letter-spacing:-0.025em;line-height:1.1}
h2{font-size:1.02rem;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;padding-bottom:0.4rem;border-bottom:2px solid var(--graphite);margin-bottom:0.9rem;display:flex;align-items:baseline;gap:0.6rem;flex-wrap:wrap}
h2 .note{font-family:var(--code);font-size:0.72rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--graphite-2);margin-left:auto}
h3{font-size:0.98rem;font-weight:700}
.lede{max-width:66ch;color:var(--graphite-2);margin-top:0.5rem}

/* ── THE LIST: coded rows ── */
.list{border-top:1px solid var(--rule)}
.row{
  display:grid;grid-template-columns:78px 1fr auto;gap:0.9rem;align-items:center;
  padding:0.62rem 0.4rem;border-bottom:1px solid var(--rule);
  transition:background-color 140ms var(--ease);
}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--shade)}}
.row .code{font-family:var(--code);font-size:0.72rem;font-weight:700;color:var(--stamp);letter-spacing:0.04em}
.row .nm{font-weight:600}
.row .sci{font-family:var(--code);font-size:0.72rem;color:var(--graphite-2);font-style:italic}
.row .meta{font-family:var(--code);font-size:0.72rem;color:var(--graphite-2)}
.row .act{display:flex;gap:0.4rem;align-items:center}
@media (max-width:640px){.row{grid-template-columns:64px 1fr;gap:0.6rem}.row .act{grid-column:1/-1;justify-content:flex-start;padding-left:64px}}

/* tick box — the pencil check */
.tick{
  width:23px;height:23px;flex:none;border:2.5px solid var(--graphite);background:var(--sheet);
  display:grid;place-items:center;transition:background-color 120ms var(--ease),transform 110ms var(--ease);
}
.tick:active{transform:scale(0.92)}
.tick[aria-pressed="true"]{background:var(--hivis)}
.tick i{font-size:0.72rem;opacity:0;transition:opacity 120ms var(--ease)}
.tick[aria-pressed="true"] i{opacity:1}

/* ── CHIPS / TAGS ── */
.chip{display:inline-flex;align-items:center;gap:0.3rem;font-family:var(--code);font-size:0.72rem;font-weight:500;letter-spacing:0.05em;padding:0.16rem 0.42rem;border:1.5px solid var(--rule-firm);color:var(--graphite-2);white-space:nowrap}
.chip.on{background:var(--hivis);border-color:var(--graphite);color:var(--graphite);font-weight:700}
.chip.warn{border-color:var(--survey-ink);color:var(--survey-ink)}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:0.45rem;font-family:var(--code);font-size:0.72rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;padding:0.6rem 1rem;border:2.5px solid var(--graphite);
  background:var(--sheet);text-decoration:none;
  transition:transform 110ms var(--ease),background-color 140ms var(--ease);
}
.btn:active{transform:scale(0.97)}
.btn-go{background:var(--survey);color:#fff;border-color:var(--graphite)}
.btn-hi{background:var(--hivis)}
.btn-sm{padding:0.34rem 0.6rem;font-size:0.72rem;border-width:2px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--shade)}
  .btn-go:hover{background:var(--survey-deep)}
  .btn-hi:hover{background:var(--hivis-deep)}
}

/* ── FORM FIELDS: ruled blanks ── */
.field{display:block;margin-bottom:0.9rem}
.field > span{display:block;font-family:var(--code);font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--graphite-2);margin-bottom:0.28rem}
.field input,.field select{
  width:100%;font-family:var(--code);font-size:1rem;padding:0.5rem 0.6rem;
  background:var(--sheet);border:0;border-bottom:2.5px solid var(--graphite);color:var(--graphite);
}
.field input::placeholder{color:#9AA79B}
.opts{display:flex;gap:0.5rem;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:0.45rem;border:2px solid var(--rule-firm);padding:0.45rem 0.7rem;font-size:1rem;transition:background-color 130ms var(--ease),border-color 130ms var(--ease)}
.opt[aria-pressed="true"]{border-color:var(--graphite);background:var(--hivis);font-weight:600}
.opt i{font-size:1rem}

/* ── PANELS ── */
.panel{border:2.5px solid var(--graphite);background:var(--sheet)}
.panel > header{background:var(--graphite);color:var(--sheet);font-family:var(--code);font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:0.4rem 0.7rem}
.panel .body{padding:0.8rem 0.85rem}
.split{display:grid;grid-template-columns:1fr 340px;gap:1.3rem;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.9rem}
/* plant plate — the catalogue has images; a row of text cannot tell a
   cactus from a shrub */
.plate{width:58px;height:44px;flex:none;display:block;border:1.5px solid var(--graphite);background:var(--shade);color:var(--graphite)}
.plate svg{width:100%;height:100%;display:block}
.row.has-plate{grid-template-columns:70px 58px 1fr auto}
@media (max-width:640px){.row.has-plate{grid-template-columns:58px 1fr}.row.has-plate .plate{display:none}}
.offworld{display:none}

/* rebate — states print themselves as content */
.rebate{border:2px solid var(--graphite);background:var(--sheet);padding:0.75rem 0.8rem}
.rebate .amt{font-family:var(--code);font-weight:700;font-size:clamp(1.35rem,3.4vw,2rem);letter-spacing:-0.03em;line-height:1}
.rebate .prog{font-weight:700;margin-top:0.2rem}
.rebate .unverified{font-family:var(--code);font-size:0.72rem;color:var(--survey-ink);border-top:1px dashed var(--survey-ink);margin-top:0.55rem;padding-top:0.4rem}

/* wildlife log */
.sight{display:flex;align-items:center;gap:0.7rem;padding:0.5rem 0.3rem;border-bottom:1px solid var(--rule)}
.sight .dot{width:26px;height:26px;flex:none;display:grid;place-items:center;border:2px solid var(--graphite)}
.score{font-family:var(--code);font-size:clamp(1.9rem,6vw,3.4rem);font-weight:700;letter-spacing:-0.04em;line-height:1}

/* month strip */
.months{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0.5rem}
.months::-webkit-scrollbar{display:none}
.mo{font-family:var(--code);font-size:0.72rem;font-weight:700;padding:0.4rem 0.6rem;border:2px solid var(--rule-firm);flex:none;transition:background-color 130ms var(--ease)}
.mo[aria-pressed="true"]{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}

/* landing */
.landing{display:grid;place-items:center;min-height:64vh;text-align:center;padding:2rem 1rem}
.landing h1{font-size:clamp(1.9rem,6vw,3.4rem);max-width:16ch;margin:0 auto}
.landing .sub{max-width:52ch;margin:0.9rem auto 1.8rem;color:var(--graphite-2)}
.landing .choices{display:flex;gap:0.8rem;flex-wrap:wrap;justify-content:center}
.demo-note{font-family:var(--code);font-size:0.72rem;color:var(--graphite-2);margin-top:1.6rem;border-top:1px solid var(--rule);padding-top:0.7rem;max-width:46ch}

/* demo banner */
.demo-bar{background:var(--stamp);color:#fff;font-family:var(--code);font-size:0.72rem;letter-spacing:0.05em;padding:0.42rem 0;text-align:center}
.demo-bar button{text-decoration:underline;text-underline-offset:2px;font-weight:700}

/* empty state */
.empty{text-align:center;padding:2.4rem 1rem;color:var(--graphite-2)}
.empty i{font-size:34px;color:var(--rule-firm)}

/* ── SIGNATURE MOTION: rows re-rank in place ── */
.row,.rebate{will-change:auto}
@media (prefers-reduced-motion:no-preference){
  .flip{transition:transform 420ms var(--ease)}
}
footer{font-family:var(--code);font-size:0.72rem;color:var(--graphite-2);padding:1.1rem 0 2rem;display:flex;gap:0.8rem;justify-content:space-between;flex-wrap:wrap}
</style>
</head>

<!--
THESIS: The yard as a running field list — dated, coded, tallied rows in a book built for
outdoor use. Refuses the calm-plant-app arrangement of soft cards on a sage ground.
OWN-WORLD: Rite-in-the-Rain notebook. Waterproof grid stock #E7EBE3 ruled at 22px, graphite
#1F2420, high-vis cover yellow #F2C300 carrying logged/active state, surveyor orange #E2571E
for action, violet #5B3A8C as locality stamp ink. Archivo for the form, Azeret Mono for codes,
figures and tallies.
STORY: A visitor picks a demo yard or their own, sees their locality stamped and their tallies
running, and adds a row — a plant, a sighting, a ticked care task.
FIRST VIEWPORT: Hi-vis locality band (brand left, stamped LOCALITY · ZONE right), a four-cell
tally band of running figures, index tabs, then the list itself. The primary action is the row
you add, top-right of the list.
FORM: The Field List — candidate 4 of 7 (assigned by the roll). Seed key a1220fee. Code-led:
image workspace had zero credits.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->

/* ── STATE ────────────────────────────────────────────────────── */
const KEY = 'rewild_field_list_v1';
const BLANK = { view:'landing', yard:null, plants:[], sightings:[], done:{}, month:new Date().getMonth(), demo:false };

let S = load();

function load(){
  try { const r = localStorage.getItem(KEY); return r ? Object.assign({}, BLANK, JSON.parse(r)) : Object.assign({}, BLANK); }
  catch { return Object.assign({}, BLANK); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function set(patch){ Object.assign(S, patch); save(); render(); }

/* ── HELPERS ──────────────────────────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = (id) => document.getElementById(id);
const money = n => '$' + n.toLocaleString('en-US');

/* Climate band from state — drives which care tips apply. */
const COLD = ['WI','MN','MI','ME','VT','NH','ND','SD','MT','WY','AK','IA','NY','MA'];
const WARM = ['AZ','NV','TX','FL','CA','NM','LA','GA','AL','MS','SC','HI'];
function band(st){ if (COLD.includes(st)) return 'cold'; if (WARM.includes(st)) return 'warm'; return 'temperate'; }
/* null when we genuinely do not know — an unsupported location is told so
   rather than being quietly assigned a temperate band. */
function bandOrNull(st){ return (!st || st === 'OTHER') ? null : band(st); }

/* Rebates matching the yard, by state then ZIP prefix. */
function matchingRebates(){
  if (!S.yard || !S.yard.state) return [];
  const zip = (S.yard.zip||'').slice(0,3);
  return DATA.rebates
    .filter(r => r.state === S.yard.state)
    .map(r => ({ ...r, exact: r.zip_prefixes.includes(zip) }))
    .sort((a,b) => (b.exact?1:0)-(a.exact?1:0));
}
/* Dollars on the table, given the plot size the user entered. */
function rebateValue(){
  const sqft = parseInt(S.yard && S.yard.sqft,10);
  if (!sqft) return 0;
  return matchingRebates().reduce((best,r) =>
    sqft < r.min_sqft ? best : Math.max(best, Math.min(sqft * r.amount_per_sqft, r.max_amount)), 0);
}
/* Habitat score — weighted by species group, the wildlife log's payoff. */
function habitatScore(){
  return Math.round(S.sightings.reduce((n,s) => n + (DATA.wildlifeScore[s.kind]||1), 0));
}
/* Plants filtered by the yard's goals and sorted by fit — the re-rank. */
/* Locality first, then goals — PRODUCT.md principle 1. A species that is
   not native to the yard's climate band is not a match at any goal score. */
function rankedPlants(){
  const goals = (S.yard && S.yard.goals) || [];
  const b = bandOrNull((S.yard && S.yard.state) || '');
  const score = p => {
    let n = 0;
    const wv = p.wildlifeValue.join(' ');
    if (goals.includes('pollinators') && /pollinator|butterfly/.test(wv)) n += 2;
    if (goals.includes('birds') && /bird/.test(wv)) n += 2;
    if (goals.includes('low_maint') && p.duration === 'Perennial') n += 1;
    if (goals.includes('low_water') && (p.bands.length === 1 && p.bands[0] === 'warm')) n += 1;
    return n;
  };
  const rows = DATA.plants.map(p => ({ ...p, fit: score(p), native: !b || p.bands.includes(b) }));
  return rows.sort((a,b2) =>
    (b2.native?1:0)-(a.native?1:0) || b2.fit - a.fit || a.name.localeCompare(b2.name));
}

/* ── SIGNATURE MOTION ─────────────────────────────────────────────
   When a constraint changes, rows re-rank in place rather than
   silently re-rendering. First/Last/Invert/Play against the list.  */
function reRank(container, mutate){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !container) { mutate(); return; }
  const first = new Map();
  container.querySelectorAll('[data-key]').forEach(n => first.set(n.dataset.key, n.getBoundingClientRect().top));
  mutate();
  const next = document.querySelector('#'+container.id);
  if (!next) return;
  next.querySelectorAll('[data-key]').forEach(n => {
    const was = first.get(n.dataset.key);
    if (was == null) return;
    const dy = was - n.getBoundingClientRect().top;
    if (!dy) return;
    n.style.transform = 'translateY('+dy+'px)';
    requestAnimationFrame(() => { n.classList.add('flip'); n.style.transform = ''; });
    setTimeout(() => { n.classList.remove('flip'); }, 460);
  });
}

  + '<div class="locality"><div class="wrap loc-in">'
  +   '<div class="brand">ReWild <span>Field List</span></div>'
  +   '<div class="loc-stamp"><i class="ti ti-map-pin" aria-hidden="true"></i>' + esc(loc)
  +     ' · ' + esc(band(y.state||'').toUpperCase())
  +     ' <button data-act="edit-loc">change</button></div>'
  + '</div></div>'
  + '<div class="wrap">'
  +   tallyBand()
  +   '<nav class="tabs" aria-label="Sections">'
  +     TABS.map(([id,label]) =>
  '<button class="tab" data-act="go" data-view="'+id+'"'+(S.view===id?' aria-current="page"':'')+'>'+esc(label)+'</button>').join('')
  +   '</nav>'
  +   '<main>' + inner + '</main>'
  +   '<footer><span>ReWild · field list</span><span>Everything is stored in this browser only.</span></footer>'
  + '</div>';
}

function tallyBand(){
  const v = rebateValue();
  return '<div class="tallies">'
  + '<div class="tally"><b class="mono">'+S.plants.length+'</b><small>Species logged</small></div>'
  + '<div class="tally"><b class="mono">'+S.sightings.length+'</b><small>Sightings</small></div>'
  + '<div class="tally lit"><b class="mono">'+habitatScore()+'</b><small>Habitat score</small></div>'
  + '<div class="tally"><b class="mono">'+(v?money(Math.round(v)):'—')+'</b><small>Est. rebate</small></div>'
  + '</div>';
}

/* ── VIEWS ────────────────────────────────────────────────────── */
function viewLanding(){
  /* the world is present before the first click: the hi-vis band, the
     blank locality stamp, and a tally band running on zeroes */
  return '<div class="locality"><div class="wrap loc-in">'
  +   '<div class="brand">ReWild <span>Field List</span></div>'
  +   '<div class="loc-stamp"><i class="ti ti-map-pin" aria-hidden="true"></i>Locality not set</div>'
  + '</div></div>'
  + '<div class="wrap">'
  +   '<div class="tallies">'
  +     '<div class="tally"><b class="mono">' + DATA.plants.length + '</b><small>Native species</small></div>'
  +     '<div class="tally"><b class="mono">' + DATA.rebates.length + '</b><small>Rebate programs</small></div>'
  +     '<div class="tally"><b class="mono">8</b><small>States covered</small></div>'
  +     '<div class="tally lit"><b class="mono">12</b><small>Months of guidance</small></div>'
  +   '</div>'
  +   '<main><div class="landing"><div>'
  +     '<h1>Keep your yard as a field list.</h1>'
  +     '<p class="sub">Native plants for your climate band, the cash rebates that pay for replacing lawn, and a wildlife log that turns the whole argument into something you watched happen.</p>'
  +     '<div class="choices">'
  +       '<button class="btn btn-go" data-act="demo"><i class="ti ti-eye" aria-hidden="true"></i> Explore a demo yard</button>'
  +       '<button class="btn btn-hi" data-act="setup"><i class="ti ti-pencil" aria-hidden="true"></i> Set up my own</button>'
  +     '</div>'
  +     '<p class="demo-note">The demo opens a worked Milwaukee yard with plants, sightings and matched rebates already in it. Nothing is sent anywhere — all state lives in this browser.</p>'
  +   '</div></div></main>'
  +   '<footer><span>ReWild · field list</span><span>Everything is stored in this browser only.</span></footer>'
  + '</div>';
}

function viewYard(){
  const y = S.yard;
  if (!y || !y.setupDone) return viewSetup();
  const b = band(y.state);
  const tips = (DATA.months[S.month] || {});
  const list = (tips.all||[]).concat(tips[b]||[]);
  return '<div class="pad">'
  + '<h1>Your yard</h1>'
  + '<p class="lede">'+esc(y.sqft?y.sqft+' sq ft':'Plot size not set')+' · '+esc(sunLabel(y.sun))+' · '+esc(b)+' climate band</p>'
  + '<div class="split" style="margin-top:1.3rem">'
  +   '<section>'
  +     '<h2>This month <span class="note">'+esc(DATA.monthNames[S.month])+'</span></h2>'
  +     (list.length ? '<div class="list">'+list.map((t,i)=>{
            const k='tip-'+S.month+'-'+i, on=!!S.done[k];
            return '<div class="row" data-key="'+k+'"><button class="tick" data-act="tick" data-key="'+k+'" aria-pressed="'+on+'" aria-label="Mark done"><i class="ti ti-check" aria-hidden="true"></i></button>'
            + '<div class="nm" style="grid-column:2/-1">'+esc(t)+'</div></div>';
          }).join('')+'</div>'
        : '<p class="empty">No guidance recorded for this month.</p>')
  +     '<h2 style="margin-top:1.6rem">Planted <span class="note">'+S.plants.length+' species</span></h2>'
  +     (S.plants.length ? '<div class="list">'+S.plants.map(sym=>{
            const p = DATA.plants.find(x=>x.symbol===sym); if(!p) return '';
            return '<div class="row" data-key="p-'+esc(sym)+'"><span class="code">'+esc(p.symbol)+'</span>'
            + '<div><div class="nm">'+esc(p.name)+'</div><div class="sci">'+esc(p.sciName)+'</div></div>'
            + '<div class="act"><button class="btn btn-sm" data-act="unplant" data-sym="'+esc(sym)+'">Remove</button></div></div>';
          }).join('')+'</div>'
        : '<div class="empty"><i class="ti ti-seedling" aria-hidden="true"></i><p>Nothing planted yet. Open <b>Plants</b> and add the first row.</p></div>')
  +   '</section>'
  +   '<aside>'
  +     '<div class="panel"><header>Est. rebate</header><div class="body">'
  +       (rebateValue() ? '<div class="rebate" style="border:0;padding:0"><div class="amt">'+money(Math.round(rebateValue()))+'</div>'
          + '<p class="unverified">ReWild&rsquo;s estimate from your plot size, not an offer. Amounts and eligibility change — verify on the program site.</p></div>'
          : '<p style="font-size:1rem;color:var(--graphite-2)">Set your state, ZIP and plot size to see what is available.</p>')
  +     '</div></div>'
  +     '<div class="panel" style="margin-top:0.9rem"><header>Habitat score</header><div class="body">'
  +       '<div class="score mono">'+habitatScore()+'</div>'
  +       '<p style="font-size:1rem;color:var(--graphite-2);margin-top:0.3rem">Weighted by what you logged. Bees and butterflies count most.</p>'
  +     '</div></div>'
  +   '</aside>'
  + '</div></div>';
}

/* Drawn plates by growth form — a field guide uses plates, not photos. */
const PLATES = {
  'Grass':     '<path d="M29 40 C29 28 24 18 18 11 M29 40 C29 26 33 16 40 9 M29 40 C29 30 27 22 25 16 M29 40 C29 30 32 22 35 15" />',
  'Forb/herb': '<path d="M29 40 V17" /><circle cx="29" cy="12" r="5" /><path d="M29 26 C24 26 21 23 21 19 M29 30 C34 30 37 27 37 23" />',
  'Shrub':     '<path d="M29 40 V26" /><path d="M17 26 C17 16 23 10 29 10 C35 10 41 16 41 26 Z" /><path d="M29 33 L23 28 M29 30 L35 25" />',
  'Cactus':    '<path d="M25 40 V16 C25 12 28 10 31 12 C33 13 33 16 33 18 V40 Z" /><path d="M25 26 H19 C17 26 16 24 16 22 M33 22 H39 C41 22 42 20 42 18" />'
};
function plate(cat){
  const d = PLATES[cat] || PLATES['Forb/herb'];
  return '<span class="plate" aria-hidden="true"><svg viewBox="0 0 58 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg></span>';
}

function sunLabel(v){ const o=(DATA.sun||[]).find(s=>s.value===v); return o?o.label:'Sun not set'; }

function viewSetup(){
  const y = S.yard || {};
  const states = [...new Set(DATA.rebates.map(r=>r.state))].sort();
  return '<div class="pad"><h1>Set up your yard</h1>'
  + '<p class="lede">Location and light decide everything else. Nothing here leaves your browser.</p>'
  + '<form id="setup" style="max-width:520px;margin-top:1.3rem">'
  +   '<label class="field"><span>State</span><select name="state" required>'
  +     '<option value="">Select…</option>'
  +     states.map(s=>'<option value="'+s+'"'+(y.state===s?' selected':'')+'>'+s+'</option>').join('')
  +     '<option value="OTHER"'+(y.state==='OTHER'?' selected':'')+'>Somewhere else</option>'
  +   '</select></label>'
  +   '<label class="field"><span>City</span><input name="city" value="'+esc(y.city||'')+'" placeholder="Milwaukee"></label>'
  +   '<label class="field"><span>ZIP</span><input name="zip" value="'+esc(y.zip||'')+'" placeholder="53202" inputmode="numeric"></label>'
  +   '<label class="field"><span>Plot size you would convert (sq ft)</span><input name="sqft" value="'+esc(y.sqft||'')+'" placeholder="400" inputmode="numeric"></label>'
  +   '<div class="field"><span>Sun exposure <em style="font-family:var(--code);font-size:0.72rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--survey-ink)">recorded, not yet used for matching</em></span><div class="opts" id="sunopts">'
  +     DATA.sun.map(s=>'<button type="button" class="opt" data-act="sun" data-v="'+s.value+'" aria-pressed="'+(y.sun===s.value)+'"><i class="ti '+s.icon+'" aria-hidden="true"></i>'+esc(s.label)+'</button>').join('')
  +   '</div></div>'
  +   '<div class="field"><span>What is this for?</span><div class="opts" id="goalopts">'
  +     DATA.goals.map(g=>'<button type="button" class="opt" data-act="goal" data-v="'+g.value+'" aria-pressed="'+(((y.goals)||[]).includes(g.value))+'"><i class="ti '+g.icon+'" aria-hidden="true"></i>'+esc(g.label)+'</button>').join('')
  +   '</div></div>'
  +   '<button class="btn btn-go" type="submit"><i class="ti ti-check" aria-hidden="true"></i> Save the yard</button>'
  + '</form></div>';
}

function viewPlants(){
  const ranked = rankedPlants();
  const goals = (S.yard && S.yard.goals) || [];
  return '<div class="pad">'
  + '<h1>Plants</h1>'
  + '<p class="lede">'+ranked.length+' native species, ordered by climate band first and then by your goals. '+(goals.length
      ? 'Change a goal and the list re-ranks in place.'
      : 'Pick a goal below and the list re-ranks in place.')+'</p>'
  + '<div class="opts" style="margin:1rem 0 0.4rem">'
  +   DATA.goals.map(g=>'<button class="opt" data-act="goal-live" data-v="'+g.value+'" aria-pressed="'+goals.includes(g.value)+'"><i class="ti '+g.icon+'" aria-hidden="true"></i>'+esc(g.label)+'</button>').join('')
  + '</div>'
  + '<h2 style="margin-top:1.2rem">The list <span class="note">code · species · fit</span></h2>'
  + '<div class="list" id="plantlist">'
  + ranked.map(p=>{
      const planted = S.plants.includes(p.symbol);
      return '<div class="row has-plate" data-key="'+esc(p.symbol)+'">'
      + '<span class="code">'+esc(p.symbol)+'</span>'
      + plate(p.category)
      + '<div><div class="nm">'+esc(p.name)+(p.native?'':' <span class="chip warn">outside your band</span>')+'</div><div class="sci">'+esc(p.sciName)+'</div>'
      +   '<div style="margin-top:0.3rem;display:flex;gap:0.3rem;flex-wrap:wrap">'
      +   '<span class="chip">'+esc(p.category)+'</span>'
      +   (p.fit ? '<span class="chip on">fit '+p.fit+'</span>' : '')
      +   p.wildlifeValue.map(w=>'<span class="chip">'+esc(w)+'</span>').join('')
      +   '</div></div>'
      + '<div class="act"><button class="btn btn-sm '+(planted?'btn-hi':'')+'" data-act="plant" data-sym="'+esc(p.symbol)+'">'
      +   (planted?'<i class="ti ti-check" aria-hidden="true"></i> Planted':'Add')+'</button></div>'
      + '</div>';
    }).join('')
  + '</div></div>';
}

function viewRebates(){
  const y = S.yard||{}, ms = matchingRebates(), sqft = parseInt(y.sqft,10)||0;
  return '<div class="pad"><h1>Rebates</h1>'
  + '<p class="lede">Cash programs that pay you to replace lawn. Program names and terms are real but <b>unverified</b>, and every dollar figure here is ReWild&rsquo;s own estimate from your plot size — not an offer, not an approval. Confirm on the program site before counting on the money.</p>'
  + (!y.state ? '<div class="empty"><i class="ti ti-map-pin-off" aria-hidden="true"></i><p>Set your state in <b>My yard</b> to match programs.</p></div>'
    : ms.length ? '<div class="cards" style="margin-top:1.2rem">'+ms.map(r=>{
        const est = sqft && sqft >= r.min_sqft ? Math.min(sqft*r.amount_per_sqft, r.max_amount) : 0;
        return '<div class="rebate" data-key="'+esc(r.program)+'">'
        + '<div class="amt">'+(est?money(Math.round(est)):'$'+r.amount_per_sqft+'/sq ft')+'</div>'
        + '<div class="prog">'+esc(r.program)+'</div>'
        + '<div class="meta mono" style="font-size:0.72rem;color:var(--graphite-2);margin-top:0.2rem">'+esc(r.city)+', '+esc(r.state)+' · '+esc(r.category)+'</div>'
        + '<p style="font-size:1rem;margin-top:0.5rem">'+esc(r.description)+'</p>'
        + '<div style="margin-top:0.55rem;display:flex;gap:0.35rem;flex-wrap:wrap">'
        +   '<span class="chip">min '+r.min_sqft+' sq ft</span><span class="chip">cap '+money(r.max_amount)+'</span>'
        +   (r.exact?'<span class="chip on">matches your ZIP</span>':'')
        + '</div>'
        + '<p class="unverified">Unverified — check current terms at the program.</p>'
        + '<a class="btn btn-sm" style="margin-top:0.5rem" href="'+esc(r.url)+'" target="_blank" rel="noopener">Programme site <i class="ti ti-external-link" aria-hidden="true"></i></a>'
        + '</div>';
      }).join('')+'</div>'
    : '<div class="empty"><i class="ti ti-search-off" aria-hidden="true"></i><p>No programs recorded for '+esc(y.state)+' yet. ReWild covers eight states so far.</p></div>')
  + '</div>';
}

function viewWildlife(){
  return '<div class="pad"><h1>Wildlife log</h1>'
  + '<p class="lede">The proof mechanism. Log what turns up and the habitat score follows.</p>'
  + '<div class="split" style="margin-top:1.2rem"><section>'
  + '<h2>Log a sighting</h2>'
  + '<div class="opts">'+DATA.wildlife.map(w=>'<button class="opt" data-act="log" data-kind="'+w.value+'"><i class="ti '+w.icon+'" aria-hidden="true"></i>'+esc(w.label)+'</button>').join('')+'</div>'
  + '<h2 style="margin-top:1.5rem">Recorded <span class="note">'+S.sightings.length+' entries</span></h2>'
  + (S.sightings.length ? '<div class="list">'+S.sightings.slice(0,40).map(s=>{
      const w = DATA.wildlife.find(x=>x.value===s.kind)||{label:s.kind,icon:'ti-circle'};
      return '<div class="sight" data-key="s-'+s.id+'"><span class="dot"><i class="ti '+w.icon+'" aria-hidden="true"></i></span>'
      + '<div style="flex:1"><b>'+esc(w.label)+'</b><div class="mono" style="font-size:0.72rem;color:var(--graphite-2)">'+esc(new Date(s.date).toLocaleDateString())+'</div></div>'
      + '<button class="btn btn-sm" data-act="unlog" data-id="'+s.id+'">Remove</button></div>';
    }).join('')+'</div>'
    : '<div class="empty"><i class="ti ti-butterfly" aria-hidden="true"></i><p>Nothing logged yet. Tap a species above the moment you see one.</p></div>')
  + '</section><aside><div class="panel"><header>Habitat score</header><div class="body">'
  + '<div class="score mono">'+habitatScore()+'</div>'
  + '<p style="font-size:1rem;color:var(--graphite-2);margin-top:0.4rem">Bees and butterflies weigh 3, birds, mammals and amphibians 2, beetles 1.5, spiders 1.</p>'
  + '</div></div></aside></div></div>';
}

function viewCalendar(){
  const b = bandOrNull((S.yard&&S.yard.state)||'');
  const t = DATA.months[S.month]||{};
  const rows = (t.all||[]).map(x=>['All climates',x])
    .concat(b ? (t[b]||[]).map(x=>[b+' climates',x]) : []);
  return '<div class="pad"><h1>Care calendar</h1>'
  + '<p class="lede">'+(b
      ? 'What to do this month where you actually are. Your band: <b>'+esc(b)+'</b>.'
      : 'Your location is outside the eight states ReWild covers, so it cannot place you in a climate band. Only the all-climates guidance below applies — treat the rest as unknown rather than as advice.')+'</p>'
  + '<div class="months" style="margin-top:1rem">'
  + DATA.monthNames.map((m,i)=>'<button class="mo" data-act="month" data-i="'+i+'" aria-pressed="'+(i===S.month)+'">'+esc(m.slice(0,3))+'</button>').join('')
  + '</div>'
  + '<h2 style="margin-top:1rem">'+esc(DATA.monthNames[S.month])+' <span class="note">'+rows.length+' tasks</span></h2>'
  + (rows.length ? '<div class="list">'+rows.map(([scope,text],i)=>{
      const k='cal-'+S.month+'-'+i, on=!!S.done[k];
      return '<div class="row" data-key="'+k+'"><button class="tick" data-act="tick" data-key="'+k+'" aria-pressed="'+on+'" aria-label="Mark done"><i class="ti ti-check" aria-hidden="true"></i></button>'
      + '<div><div class="nm">'+esc(text)+'</div><div class="meta">'+esc(scope)+'</div></div><div></div></div>';
    }).join('')+'</div>' : '<p class="empty">Nothing recorded for this month.</p>')
  + '</div>';
}

function viewMarket(){
  const g = (k)=>DATA.market.filter(x=>x.group===k);
  /* rows, in the same idiom as every other section — the thesis refuses
     a wall of same-size cards, and so does the craft floor */
  const row = p => '<div class="row" data-key="'+esc(p.id)+'">'
    + '<span class="code"><i class="ti '+esc(p.icon)+'" aria-hidden="true"></i></span>'
    + '<div><div class="nm">'+esc(p.name)+'</div>'
    +   '<div class="sci" style="font-style:normal">'+esc(p.sub||(p.city?p.city+', '+p.state:''))+'</div>'
    +   (p.desc?'<div class="meta" style="margin-top:0.25rem;max-width:62ch">'+esc(p.desc)+'</div>':'')
    +   (p.specs?'<div style="margin-top:0.3rem;display:flex;gap:0.3rem;flex-wrap:wrap">'+p.specs.map(s=>'<span class="chip">'+esc(s)+'</span>').join('')+'</div>':'')
    + '</div>'
    + '<div class="act"><a class="btn btn-sm" href="'+esc(p.link||p.url)+'" target="_blank" rel="noopener">Visit <i class="ti ti-external-link" aria-hidden="true"></i></a></div>'
    + '</div>';
  return '<div class="pad"><h1>Marketplace</h1>'
  + '<p class="lede">Seed, starter kits and native nurseries. ReWild links out and sells nothing — it takes no commission and has no arrangement with any seller listed here. Prices live at the vendor.</p>'
  + '<h2 style="margin-top:1.2rem">Seed <span class="note">'+g('seed').length+'</span></h2><div class="list">'+g('seed').map(row).join('')+'</div>'
  + '<h2 style="margin-top:1.5rem">Kits <span class="note">'+g('kit').length+'</span></h2><div class="list">'+g('kit').map(row).join('')+'</div>'
  + '<h2 style="margin-top:1.5rem">Nurseries <span class="note">'+g('nursery').length+'</span></h2><div class="list">'+g('nursery').map(row).join('')+'</div>'
  + '</div>';
}

/* ── RENDER ───────────────────────────────────────────────────── */
function render(){
  const v = S.view;
  if (v === 'landing') { el('app').innerHTML = viewLanding(); return; }
  const body =
      v === 'plants'   ? viewPlants()
    : v === 'rebates'  ? viewRebates()
    : v === 'wildlife' ? viewWildlife()
    : v === 'calendar' ? viewCalendar()
    : v === 'market'   ? viewMarket()
    : v === 'setup'    ? viewSetup()
    : viewYard();
  el('app').innerHTML = shell(body);
}

/* ── EVENTS ───────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;

  if (a === 'go')       return set({ view: t.dataset.view });
  if (a === 'demo')     return startDemo();
  if (a === 'setup')    return set({ view:'setup', demo:false, yard:{} });
  if (a === 'edit-loc') return set({ view:'setup' });
  if (a === 'reset')    { localStorage.removeItem(KEY); S = Object.assign({}, BLANK); return render(); }
  if (a === 'month')    return set({ month: +t.dataset.i });

  if (a === 'tick'){
    const k = t.dataset.key; S.done[k] = !S.done[k]; save();
    t.setAttribute('aria-pressed', String(!!S.done[k]));   /* edit in place, no re-render */
    return;
  }
  if (a === 'plant'){
    const s = t.dataset.sym;
    S.plants = S.plants.includes(s) ? S.plants.filter(x=>x!==s) : S.plants.concat(s);
    save(); return render();
  }
  if (a === 'unplant'){ S.plants = S.plants.filter(x=>x!==t.dataset.sym); save(); return render(); }
  if (a === 'log'){
    S.sightings.unshift({ id: Date.now(), kind: t.dataset.kind, date: new Date().toISOString() });
    save(); return render();
  }
  if (a === 'unlog'){ S.sightings = S.sightings.filter(s=>s.id!==+t.dataset.id); save(); return render(); }

  /* the signature interaction: goals change, the list visibly re-ranks */
  if (a === 'goal-live'){
    S.yard = S.yard || {}; const g = S.yard.goals || [];
    S.yard.goals = g.includes(t.dataset.v) ? g.filter(x=>x!==t.dataset.v) : g.concat(t.dataset.v);
    save();
    return reRank(el('plantlist'), render);
  }
  if (a === 'sun'){
    document.querySelectorAll('#sunopts .opt').forEach(b=>b.setAttribute('aria-pressed','false'));
    t.setAttribute('aria-pressed','true'); t.dataset.picked = '1';
    return;
  }
  if (a === 'goal'){
    t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')==='true' ? 'false' : 'true');
    return;
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'setup') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const sun = document.querySelector('#sunopts .opt[aria-pressed="true"]');
  const goals = [...document.querySelectorAll('#goalopts .opt[aria-pressed="true"]')].map(b=>b.dataset.v);
  set({
    view:'yard', demo:false,
    yard:{ state:f.get('state'), city:f.get('city'), zip:f.get('zip'), sqft:f.get('sqft'),
           sun: sun?sun.dataset.v:'', goals, setupDone:true }
  });
});

/* ── DEMO YARD ────────────────────────────────────────────────── */
function startDemo(){
  const now = Date.now();
  set({
    view:'yard', demo:true,
    yard:{ state:'WI', city:'Milwaukee', zip:'53202', sqft:'600', sun:'full_sun',
           goals:['pollinators','birds'], setupDone:true },
    plants:['ASCA4','ECPU','RUHI2','MOFI','SCSC','ASNO'],
    sightings:[
      { id:now-1, kind:'butterfly', date:new Date(now-86400000*2).toISOString() },
      { id:now-2, kind:'bee',       date:new Date(now-86400000*3).toISOString() },
      { id:now-3, kind:'bird',      date:new Date(now-86400000*6).toISOString() },
      { id:now-4, kind:'bee',       date:new Date(now-86400000*9).toISOString() },
      { id:now-5, kind:'beetle',    date:new Date(now-86400000*12).toISOString() }
    ],
    done:{}
  });
}

render();
